  # ⛺ e' muro dal 2026-09-04 (ADR-0042): un telo teso blocca la vista.
  # Prima le tende disegnate col glifo giusto non bloccavano nulla e quelle
  # disegnate con ⬛ bloccavano tutto: i due errori si annullavano per caso.
  # ALTEZZA 1,0 m — decisione DM del 2026-09-12: «le tende falle piu' basse».
  # Chiude la seconda meta' del buco di ADR-0042: la tenda si estrudeva al
  # default di 0,6 m mentre un edificio sta a 3,2.
  #
  # ⚠️ Incoerenza fra le due catene, dichiarata: ⛺ e' un MURO nell'export UVTT
  # (un telo teso blocca la vista, ADR-0042) ma a 1 m nel render 3D e' piu'
  # bassa di una creatura in piedi. Le due catene rispondono a domande diverse
  # — la linea di vista nel VTT, il volume nella scena Blender — e la scelta e'
  # del DM. Se un giorno stona guardando una scena renderizzata, il numero da
  # cambiare e' questo, non il muro.
  "⛺":
    label: "Tenda (telo teso: blocca la vista, si abbatte)"
    render: {mode: icon, prop: pr_tent, fill: "#e6ccb2", altezza_m: 0.75}
    function:
      blocks_movement: true
      blocks_sight: true
      cover: total
      obscurement: none
      destructible: true
      nameable: true
  "🔮":
    label: "Cristalli / altare magico"
    render: {mode: icon, prop: pr_crystal, fill: "#caf0f8"}
    function:
      blocks_movement: true
      blocks_sight: false
      cover: half
      obscurement: none
      nameable: true
      light: {raggio_m: 6.0, colore: "b3e6ff"}
  "🪑":
    label: "Tavolo e sedie"
