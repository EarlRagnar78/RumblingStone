    master: &DEF1 "08_La Battaglia Di Hammerfist/ARC08-DEF-1-OMBRA-SULLA-MONTAGNA.md"
    affermazione: 'sente chi gli passa entro \*\*(?P<v>[\d,]+) m\*\*'
    confronto: numero
    scala: 0.3

