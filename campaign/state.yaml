# Lo stato di campagna come DATO (ADR-0050)
# ============================================================================
# Questo file e' il master dei fatti tabellari di `campaign/state.md`. Le
# tabelle di §0, §1, §2.4, §3, §4, §6 e §7.E dentro quel documento sono
# GENERATE da qui con `python3 scripts/render_state.py`, fra i marcatori
# `<!-- gen:state:NOME -->`.
#
# ⚠️ NON si modificano le tabelle in state.md: si modifica QUESTO file e si
#    rigenera. La CI confronta i due (`render_state.py --check`).
#
# 🔴 Un master, mai due. Senza il rendering questo file sarebbe una SECONDA
#    fonte di verita' accanto a state.md — cioe' il difetto C2 che l'audit
#    della PR #99 aveva appena chiuso, ricreato dalla sua stessa correzione.
#
# Cosa NON sta qui, e non e' una dimenticanza:
#   · §5 (promesse e debiti) e §7 (fili narrativi) restano PROSA. Sono le due
#     sezioni che il DM riscrive di piu' a mano, e modellarle adesso vorrebbe
#     dire indovinare uno schema per contenuto che cambia forma ogni sessione.
#   · §2 tranne i difensori e gli scenari di Rethmar: il waypoint ledger e le
#     condizioni dell'orda sono un modello a se'.
#   · §8, lo storico: e' il lotto 4d-2.
#
# ⚠️ I DATI NON VENGONO DALLA PR #99. Quel ramo e' fermo al 10 agosto ed e'
#    384 commit indietro: portare il suo `state.yaml` avrebbe annullato in
#    silenzio il canone del 2026-09-11 e 09-12 (D3, D4, D11, D13, i Tre Doni,
#    la Collana, i due tempi di 4c). Del ramo si e' recuperata la MACCHINA;
#    i valori sono stati estratti da `state.md` di oggi, e il criterio
#    d'uscita e' che rigenerandolo torni identico byte per byte.
#
# ⚠️ IL TEMPO, dichiarato dove il canone lo dichiara. `archi` porta `tempo`
#    (giocato / in_corso / preparato); `party` e `artefatti` portano i due
#    tempi come DUE COLONNE (`oggi` e `preparato`), che e' come il DM li ha
#    scritti. `villain` e `conoscenze` NON hanno un tempo per riga, e non
#    gliene ho inventato uno: `validate_state.py` li CONTA e lo dice. Un
#    numero che si vede vale piu' di un valore indovinato.
# ============================================================================
