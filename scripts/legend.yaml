  # ALTEZZA 1,5 m — decisione DM del 2026-09-12. Era l'unico simbolo che si
  # chiama «muro» e un'altezza non ce l'aveva: si estrudeva al default generico
  # di 0,6 m, cioe' un gradino. A 1,5 m e' una copertura all'altezza del petto,
  # che e' esattamente cio' che l'etichetta promette (+4 CA).
  "🧱":
