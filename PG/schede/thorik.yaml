  # l'altro al rito: è lo stesso punto, contato una volta. Il DM il 2026-10-23:
  # il canone è quello giocato dal gruppo e dagli artefatti rivisti.
  # Qui sta col rito, come in state.yaml, che è il master (ADR-0050).
