  # 🐛 ALTEZZA: 3.2 m, e fino al 2026-09-12 il commento accanto al dato nel
  # renderer Blender diceva ancora «edificio, tenda, dais» — il significato di
  # PRIMA di ADR-0042. ⛺ e 🔳 non hanno un'altezza propria: si estrudono
  # entrambi al default generico di 0,6 m. E' il TERZO sintomo della stessa
  # causa, trovato dal gate `legend/single-source` al primo uso. Non corretto
  # qui perche' e' contenuto: decisione D2 di plans/PIANO-VENDIBILITA.md §8.
  #
  # ADR-0042 — i tre glifi che stavano sotto ⬛. Fino al 2026-09-04 questo
  # simbolo valeva insieme «tenda, edificio, dais» e l'export li trattava
  # tutti da muro pieno: 8.216 celle in 24 file. Adesso sono tre cose
  # distinte — ⬛ edificio · ⛺ tenda · 🔳 dais — e ⬛ tiene il significato
  # strutturalmente piu' forte, non quello statisticamente piu' comune:
  # cosi' nessuna cella gia' disegnata si muove sotto i piedi di nessuno.
  "⬛":
    label: "Edificio / corpo di fabbrica (muratura piena: blocca vista e movimento)"
    render: {mode: fill, pat: t_struct, fill: "#6b5b47", heavy: true, altezza_m: 3.0, texture: legno}
    function:
      blocks_movement: true
      blocks_sight: true
      cover: total
      obscurement: none
      nameable: true
  # 🔳 NON e' un muro, ed e' il punto: su una pedana ci si sale, non ci si
  # sbatte contro. Glifo nato con ADR-0042; e' l'unico dei 63 la cui
  # funzione non compare nella spec §4, perche' e' nato dopo la sua
  # riverifica — ma ADR-0042 la dichiara per esteso.
  "🔳":
    label: "Dais / pedana rialzata (ci si sale sopra: NON e' un muro)"
    render: {mode: fill, pat: t_dais, fill: "#b9a884"}
