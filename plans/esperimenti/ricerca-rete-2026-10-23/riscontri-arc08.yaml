# Riscontri SRD dei master ARC08-DEF-1 e ARC08-DEF-2 (ADR-0103).
# Si eseguono con:
#   python3 scripts/riscontro_srd.py riscontra plans/esperimenti/ricerca-rete-2026-10-23/riscontri-arc08.yaml
# Il formato è nella docstring di scripts/riscontro_srd.py. Le regex dei master
# cercano il testo com'è scritto (con i ** del grassetto); quelle dell'SRD
# cercano il testo inglese, tabelle HTML comprese. Il gruppo (?P<v>...) è il
# valore che lo script confronta. Le regole sono quelle numeriche (o di un
# termine chiuso) che il master attribuisce all'SRD o prende da una scheda SRD.

versione: 1
riscontri:

