<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="Channathgate — schema degli otto rioni delle contrade, con il fiume Cannath a ovest">
  <rect width="760" height="640" fill="#e7ddc7"/>
  <text x="380" y="28" font-family="Georgia,serif" font-size="21" text-anchor="middle" font-weight="bold" fill="#3a2f22">CHANNATHGATE — Città-Porto sul Fiume Cannath</text>
  <text x="380" y="46" font-family="Georgia,serif" font-size="12" text-anchor="middle" fill="#6b5a3a">~35 miglia a est-sudest di Rethmar · gli 8 rioni delle contrade · schema di servizio, non in scala</text>

  <!-- fiume Cannath: esce dal lago di Channathgate a sud e scorre verso nord, lungo il lato ovest -->
  <path d="M150 640 C140 560 175 500 160 430 C145 360 170 300 158 230 C148 170 165 110 150 60 L200 60 C215 110 198 170 208 230 C220 300 195 360 210 430 C225 500 190 560 200 640 Z" fill="#3a91bd"/>
  <g stroke="#cfe9f4" stroke-width="2" fill="none" opacity="0.7"><path d="M170 560 q6 -12 0 -24"/><path d="M180 380 q6 -12 0 -24"/><path d="M176 200 q6 -12 0 -24"/></g>
  <text x="175" y="76" font-family="Georgia,serif" font-size="11" fill="#1f6f8a" font-style="italic" text-anchor="middle">▲ a Cannathcross e a Rethmar (ONO)</text>
  <text x="175" y="614" font-family="Georgia,serif" font-size="10" fill="#eef6fb" font-style="italic" text-anchor="middle">▲ dal lago</text>
  <text x="182" y="480" font-family="Georgia,serif" font-size="13" fill="#eef6fb" font-style="italic" transform="rotate(-84 182 480)">Fiume Cannath</text>

  <!-- ponti -->
  <rect x="140" y="146" width="80" height="10" fill="#c9a267" stroke="#5a4326" stroke-width="1.5" transform="rotate(-14 180 151)"/>
  <rect x="140" y="352" width="80" height="10" fill="#c9a267" stroke="#5a4326" stroke-width="1.5"/>

  <!-- rioni fuori le mura (sobborghi) -->
  <!-- ISTRICE: sponda ovest, a nord -->
  <path d="M20 90 H140 V320 H20 Z" fill="#6b4a1f" stroke="#3a2610" stroke-width="1" rx="4"/>
  <text x="80" y="196" font-family="Georgia,serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">ISTRICE</text>
  <text x="80" y="211" font-family="Georgia,serif" font-size="8.5" fill="#f0e2cf" text-anchor="middle">profughi · Quill-Wood</text>
  <!-- ONDA: sponda ovest, a sud, con la darsena -->
  <path d="M20 380 H142 V600 H20 Z" fill="#1f6f8a" stroke="#0d3a4a" stroke-width="1"/>
  <text x="70" y="470" font-family="Georgia,serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">ONDA</text>
  <text x="70" y="485" font-family="Georgia,serif" font-size="8.5" fill="#dff2fb" text-anchor="middle">barcaioli · Tidal Crest</text>
  <rect x="104" y="400" width="44" height="40" rx="3" fill="#0d3a4a"/>
  <g fill="#bfe6f5"><rect x="110" y="408" width="30" height="3"/><rect x="110" y="418" width="30" height="3"/><rect x="110" y="428" width="30" height="3"/></g>
  <text x="76" y="528" font-family="Georgia,serif" font-size="10" fill="#bfe6f5" text-anchor="middle" font-weight="bold">DARSENA / FLOTTA</text>
  <text x="76" y="542" font-family="Georgia,serif" font-size="8" fill="#dff2fb" text-anchor="middle">qui s'imbarca la Marea Montante</text>
  <text x="76" y="554" font-family="Georgia,serif" font-size="8" fill="#dff2fb" text-anchor="middle">… e le statue di contrabbando</text>
  <!-- UNICORNO: fra il fiume e le mura, a nord-ovest -->
  <path d="M215 110 H300 L250 200 L232 330 H218 Z" fill="#2a6fb0" stroke="#12324f" stroke-width="1"/>
  <text x="246" y="150" font-family="Georgia,serif" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">UNICORNO</text>
  <text x="246" y="163" font-family="Georgia,serif" font-size="8" fill="#e6f0ff" text-anchor="middle">Gilded Horn</text>
  <!-- BRUCO: a nord delle mura -->
  <path d="M320 64 H560 Q580 64 572 120 Q500 150 430 150 Q360 150 300 120 Z" fill="#b8a80f" stroke="#5a5206" stroke-width="1"/>
  <text x="440" y="96" font-family="Georgia,serif" font-size="13" fill="#2a2600" font-weight="bold" text-anchor="middle">BRUCO</text>
  <text x="440" y="111" font-family="Georgia,serif" font-size="8.5" fill="#3a3400" text-anchor="middle">mercato nero · Silver Weft</text>
  <!-- OCA: a est delle mura, i giardini -->
  <path d="M640 150 H740 V470 H650 Q620 330 640 150 Z" fill="#1f7a44" stroke="#0f3a22" stroke-width="1"/>
  <text x="692" y="250" font-family="Georgia,serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">OCA</text>
  <text x="692" y="265" font-family="Georgia,serif" font-size="8.5" fill="#e9ffe9" text-anchor="middle">banchieri · Golden Plume</text>
  <text x="692" y="278" font-family="Georgia,serif" font-size="8.5" fill="#e9ffe9" text-anchor="middle">giardini murati</text>
  <!-- CIVETTA: a sud delle mura -->
  <path d="M290 500 Q430 540 580 500 L600 600 H270 Z" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  <text x="435" y="558" font-family="Georgia,serif" font-size="12" fill="#c9a227" font-weight="bold" text-anchor="middle">CIVETTA</text>
  <text x="435" y="573" font-family="Georgia,serif" font-size="8.5" fill="#e8dfc7" text-anchor="middle">nobiltà decaduta · Whispering Shadows</text>

  <!-- dentro le mura -->
  <ellipse cx="440" cy="320" rx="190" ry="160" fill="#efe4cf"/>
  <!-- TORRE: metà ovest e sud -->
  <path d="M440 160 C340 160 250 230 250 320 C250 410 340 480 440 480 L440 420 L405 420 L405 220 L440 200 Z" fill="#8a1f2b" stroke="#3a0d12" stroke-width="1"/>
  <text x="325" y="318" font-family="Georgia,serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">TORRE</text>
  <text x="325" y="333" font-family="Georgia,serif" font-size="8.5" fill="#ffe1e4" text-anchor="middle">veterani · Iron Bastion</text>
  <!-- DRAGO: nord-est -->
  <path d="M440 160 C540 160 630 230 630 320 L560 340 L475 340 L475 200 L440 200 Z" fill="#8a2f5f" stroke="#4a1533" stroke-width="1"/>
  <text x="560" y="270" font-family="Georgia,serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">DRAGO</text>
  <text x="560" y="285" font-family="Georgia,serif" font-size="8.5" fill="#ffe6f2" text-anchor="middle">Guglie · Spell-Wyrm Spires</text>
  <!-- ARG: il Palazzo dei Nove sulla terrazza, a sud-est -->
  <path d="M500 360 L620 352 L615 420 L560 470 L490 460 Z" fill="#cfb48a" stroke="#4e3a24" stroke-width="4"/>
  <text x="548" y="405" font-family="Georgia,serif" font-size="9" fill="#2a1c0e" font-weight="bold" text-anchor="middle">PALAZZO DEI NOVE</text>
  <text x="548" y="418" font-family="Georgia,serif" font-size="8.5" fill="#2a1c0e" text-anchor="middle">The Seat · l'arg</text>
  <!-- PIAZZA: il maidan al centro -->
  <rect x="405" y="200" width="70" height="200" fill="#c9a267" stroke="#5a4326" stroke-width="3"/>
  <rect x="415" y="212" width="50" height="176" rx="18" fill="#d9cba8" stroke="#8a7448" stroke-width="1.5"/>
  <text x="440" y="296" font-family="Georgia,serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#3a2f22" transform="rotate(-90 440 296)">PIAZZA DEL GUADO</text>
  <text x="456" y="296" font-family="Georgia,serif" font-size="8" text-anchor="middle" fill="#6b5a3a" transform="rotate(-90 456 296)">la pista del Palio</text>
  <rect x="408" y="402" width="64" height="14" fill="#0d1b2a"/><text x="440" y="412" font-family="Georgia,serif" font-size="7.5" fill="#e9c24a" text-anchor="middle">Palazzo Gonfaloniere</text>
  <!-- bazar coperto: dalla piazza alla Porta dell'Alba -->
  <path d="M440 200 Q400 180 318 205" fill="none" stroke="#8d6a3f" stroke-width="9"/>
  <path d="M440 200 Q400 180 318 205" fill="none" stroke="#e6c995" stroke-width="5" stroke-dasharray="4 3"/>
  <text x="372" y="182" font-family="Georgia,serif" font-size="8.5" fill="#fff" text-anchor="middle">bazar coperto</text>

  <!-- mura -->
  <ellipse cx="440" cy="320" rx="190" ry="160" fill="none" stroke="#6b5a44" stroke-width="8"/>
  <g fill="#6b5a44">
    <circle cx="440" cy="160" r="6"/><circle cx="530" cy="174" r="6"/><circle cx="598" cy="222" r="6"/><circle cx="630" cy="320" r="6"/>
    <circle cx="350" cy="174" r="6"/><circle cx="252" cy="320" r="6"/><circle cx="283" cy="410" r="6"/><circle cx="350" cy="466" r="6"/><circle cx="440" cy="480" r="6"/>
  </g>
  <!-- porte con torri gemelle -->
  <g fill="#c9a267" stroke="#5a4326" stroke-width="1.5">
    <rect x="296" y="198" width="22" height="22"/><rect x="264" y="350" width="10" height="22" transform="rotate(0)"/><rect x="620" y="306" width="14" height="22"/>
  </g>
  <text x="294" y="236" font-family="Georgia,serif" font-size="9.5" fill="#fff" text-anchor="end">Porta dell'Alba</text>
  <text x="294" y="248" font-family="Georgia,serif" font-size="8" fill="#e6f0ff" text-anchor="end">ponte ▸ Rethmar</text>
  <text x="232" y="402" font-family="Georgia,serif" font-size="9" fill="#0d3a4a" text-anchor="middle">Porta</text><text x="232" y="413" font-family="Georgia,serif" font-size="9" fill="#0d3a4a" text-anchor="middle">del Porto</text>
  <text x="616" y="346" font-family="Georgia,serif" font-size="9.5" fill="#3a2f22" text-anchor="end">Porta di Terra ▸</text>
  <!-- strade -->
  <path d="M296 209 L210 160" fill="none" stroke="#8a6b3a" stroke-width="4" stroke-dasharray="10 5"/>
  <path d="M150 144 L20 122" fill="none" stroke="#e7ddc7" stroke-width="5"/>
  <text x="24" y="108" font-family="Georgia,serif" font-size="9" fill="#f0e2cf">◂ Dawn Way, 35 mi a Rethmar</text>
  <path d="M634 317 L740 312" fill="none" stroke="#8a6b3a" stroke-width="4" stroke-dasharray="10 5"/>

  <!-- note -->
  <g font-family="Georgia,serif" font-size="10" fill="#3a2f22">
    <text x="20" y="632" font-weight="bold">Nota:</text>
    <text x="56" y="632">rioni nelle posizioni della pianta del DM · in scala: channathgate-pianta.svg</text>
  </g>
</svg>
