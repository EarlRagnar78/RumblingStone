name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Il workflow Release la riesegue intera sul commit da rilasciare (ADR-0100).
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills & scripts
    # Fissato, come typst piu' sotto: dal 19 ottobre 2026 `ubuntu-latest`
    # diventa Ubuntu 26 (avviso di GitHub). Si passa a 26.04 con una PR che
    # la prova, non perche' e' cambiata l'etichetta (PRATICHE PI-3).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # serve al gate di tracciatura (diff vs base ref)

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        # ADR-0037, emendamento 2026-09-21: due piani. requirements.txt e' cio'
        # che il DM esegue (stdlib + tre eccezioni dichiarate); il file -dev
        # aggiunge pytest, che gira solo qui e in locale.
        run: pip install -r requirements-dev.txt

      # PRATICHE PI-3 (D2): le vulnerabilita' note nelle dipendenze dichiarate.
      # `-r requirements-dev.txt` include requirements.txt, quindi guarda sia
      # cio' che esegue il DM sia cio' che gira qui. Non bloccante fino al
      # 2026-10-24, poi si decide cosa blocca: pip-audit non filtra per
      # gravita', e «bloccante sulle alte» va tradotto in `--ignore-vuln`
      # dichiarati uno per uno.
      - name: Dipendenze — vulnerabilita' note (pip-audit, non bloccante)
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt

      - name: Python scripts compile
        run: python -m compileall -q scripts converters

      # ADR-0099: ruff e' in TESTING, quindi non blocca. Sale a stable (e il
      # passo compileall sopra esce, perche' ruff copre E9) dopo 14 giorni e
      # 10 run su main senza falsi allarmi (P3 di PIANO-PIATTAFORMA). Le regole
      # sono in ruff.toml: solo quelle che cercano bug, non lo stile.
      - name: ruff — nomi non definiti, codice morto, usi deprecati (testing, non bloccante)
        continue-on-error: true
        run: ruff check --output-format github

      # ADR-0102, canale TESTING: shapely ridisegna le piante di Rethmar, Dauth e
      # Channathgate dai loro programmi in scripts/piante/, e le confronta byte
      # per byte con quelle committate. Sale a stable dopo 14 giorni e 10 run su
      # main senza falsi allarmi (un arrotondamento diverso di GEOS lo sarebbe).
      - name: Piante delle città allineate ai programmi (testing, non bloccante)
        continue-on-error: true
        run: python scripts/genera_pianta_citta.py --tutte --check

      - name: Tool manifest conformance gate (ADR-0012)
        run: python scripts/tools_manifest.py --check

      - name: Shell scripts lint (shellcheck) — non-blocking
        continue-on-error: true
        run: shellcheck -S warning scripts/*.sh || true

      - name: Validate skill trees (frontmatter, links, data YAML)
        run: python scripts/validate_skills.py

      # Lo scanner di sicurezza delle skill, copiato da awesome-llm-apps
      # (Apache 2.0, ADR-0076): esce 1 su un CRITICO, come `curl ... | sh`.
      - name: Skill security scan (scripts/terzi/skill_scanner.py)
        run: python scripts/terzi/skill_scanner.py skills

      # Le adozioni rimandate: esce 1 quando la condizione di una voce si
      # accende e la voce dice ancora «in attesa» (ADR-0076).
      - name: Pending adoptions (adozioni_in_attesa.py --check)
        run: python scripts/adozioni_in_attesa.py --check

      # Le frasi vere del DM raggiungono le skill obbligatorie (L8, ORCHESTRAZIONE §4):
      # a cricchetto, fallisce se le omissioni superano il tetto di casi.json
      - name: Skill routing (instradamento_skill.py --check)
        run: python scripts/instradamento_skill.py --check

      # Due o piu' decisioni chiuse nella stessa data vogliono l'eco nel piano (L9)
      - name: Decision echo (eco_decisioni.py --check)
        run: python scripts/eco_decisioni.py --check

      # Le letture a freddo dei master (D26): in avviso finche' un master non ha
      # le letture con impronta di lettore e playtester, poi bloccante da solo
      # su una lettura scaduta o su un rilievo 🔴/🟠 senza stato (D4, ADR-0076).
      - name: Cold-read registry (registro_letture.py --check)
        run: python scripts/registro_letture.py --check

      # La quarta cosa della regola d'oro. Le prime tre le controlla il gate qui
      # sotto; questa no, ed era «una debolezza dichiarata» — finche' il
      # 2026-09-06 la tabella non si e' trovata sfasata di due righe su otto,
      # con quattro identificatori che non esistevano in nessun piano. ADR-0047.
      # Finding T4 dell'audit 2026-08-05: AGENTS.md documentava campaign/npcs/,
      # locations/ ed encounters/ — nessuna delle tre e' mai esistita, e la riga
      # 225 mandava gli agenti a cercarle. Un documento d'ingresso che descrive
      # una struttura che non c'e' non e' un refuso: e' un'istruzione sbagliata.
      - name: Documentazione contro filesystem — i percorsi citati esistono
        run: python scripts/validate_docs.py

      - name: Link e percorsi locali — su tutti i sorgenti scritti a mano
        run: python scripts/validate_docs.py --sorgenti

      - name: Decisioni aperte al DM — l'aggregato combacia coi piani
        run: python scripts/decisioni_dm.py --check

      # ADR-0087: la memoria del lavoro è generata dal repo e non resta indietro
      - name: La memoria è allineata (MEMORIA.md, ADR-0087)
        run: python scripts/memoria.py --check

      - name: Plans discipline gate — CHANGELOG obbligatorio + promemoria ADR (ADR-0009)
        if: github.event_name == 'pull_request'
        run: python scripts/check_plans_discipline.py --base "origin/${{ github.base_ref }}"

      - name: Legenda — la fonte e' una sola (ADR-0048)
        run: |
          python scripts/build_legend.py --check
          python scripts/build_legenda_skill.py --check

      - name: Stato di campagna — dati validi e state.md rigenerato identico (ADR-0050)
        run: |
          python scripts/validate_state.py
          python scripts/render_state.py --check

      # I costi permanenti dei PG non spariscono più (RIPRESA-PR 4g-1, ADR-0088):
      # ogni modificatore ha una fonte, ogni costo affermato nei documenti è
      # sulla scheda o dismesso con una ragione, e la scheda non copia state.yaml.
      - name: Schede PG — modificatori con fonte e viste rigenerate (ADR-0088)
        run: |
          python scripts/validate_pg.py
          python scripts/render_pg.py --check

      # Il debito [INFERRED] dei documenti vivi non sale (ripreso dalla #99,
      # lotto G4; ADR-0088). Canale testing (ADR-0099): non blocca finché il DM
      # non lo promuove. Se sale per una ragione: --update-baseline nello stesso commit.
      - name: Ratchet dei [INFERRED] aperti — non bloccante (ADR-0088, testing)
        continue-on-error: true
        run: python scripts/inventory_inferred.py --check

      - name: Validate generated maps (well-formed, in-sync SVGs)
        run: |
          python scripts/validate_maps.py
          python scripts/render_schemi.py --check

      - name: Validate Bestiario library (naming, headers, CR, catalog sync)
        run: python scripts/validate_bestiario.py

      - name: Bestiario rules check (GS benchmark, flag policy) — non-blocking
        continue-on-error: true
        run: python scripts/validate_bestiario.py --rules

      - name: Statblocchi machine-readable — blocchi validi e GS coerente (ADR-0021)
        run: python scripts/extract_statblocks.py --check

      # Gli `attributi` generati (94 file, 2026-09-23) devono restare quelli
      # che la regola produce: se qualcuno ritocca a mano un blocco marcato
      # come generato, o il generatore cambia, qui si vede. Un blocco che il
      # DM conferma perde la marca [INFERRED] e il cancello smette di
      # guardarlo: e' il modo previsto di uscirne.
      - name: Attributi generati — riproducibili, nei limiti, non duplicati
        run: python scripts/genera_attributi.py --check

      # `pf-dado` deve registrare i dadi vita. Il 2026-09-23 in 46 statblocchi
      # su 95 portava il danno di un'arma o una parte sola dei dadi, e nessun
      # cancello lo vedeva: il lettore di settembre rifiutava i nuovi, i
      # vecchi restavano. Le correzioni devono restare riproducibili (ADR-0065).
      - name: pf-dado registra i dadi vita, e le correzioni sono riproducibili
        run: python scripts/conformita_statblocchi.py --check

      # Ogni creatura dei booklet esce nello stesso riquadro (ADR-0105): una
      # scheda nuova scritta in prosa o in un recinto qualunque fa salire il
      # conto del suo booklet sopra il tetto.
      - name: Le creature dei booklet escono nel riquadro (misura_statblocchi_booklet)
        run: python scripts/misura_statblocchi_booklet.py --check

      - name: Validate DEF module masters (module-standard checklist, token-free review)
        run: python scripts/validate_modules.py

      - name: Moduli standalone (10-stand-alone/*, markdown e HTML)
        run: python scripts/validate_standalone.py

      # La scheda d'entrata sta nella scena, e ogni scena ha il suo box
      # (ADR-0073). Il DM, il 2026-09-25, ha inventato al tavolo sette cose
      # che DEF-4 non diceva, con tutti i cancelli verdi.
      - name: Copertura delle scene — chi e dove incontrano i PG
        run: python scripts/copertura_scene.py --check

      # Il master come componenti (ADR-0074): l'apparato d'uso si genera dal
      # master, e una copia sincronizzata (i numeri di Balvar in DEF-4) non
      # resta indietro rispetto alla sua fonte nel Bestiario.
      - name: Componenti — apparato generato e copie sincronizzate
        run: python scripts/componenti.py --check

      - name: Chiavi del quiz a due agenti ben formate
        run: python scripts/quiz_lettura.py --check

      # Le domande del developer (sviluppo-degli-incontri.md, dai due manuali
      # del DM): volo e invisibilità, chi sente il rumore, i tre TS, la soglia
      # del boss, lo skill challenge per intero. Indicatori: i rilievi che non
      # sono difetti stanno in plans/domande-developer.json con la ragione.
      - name: Domande del developer — si gioca?
        run: python scripts/domande_developer.py --check

      # Lotto 7c di AVVENTURE-COMMUNITY: lo stesso PNG o mostro con GS, pf, CA,
      # CD o classi diversi in due scene. Solo ARC-07 e ARC-08, dove la
      # precisione è misurata (4 su 4); le contraddizioni che aspettano il DM
      # stanno in plans/coerenza-residui.json con la ragione.
      - name: Coerenza fra scene e archi
        run: python scripts/coerenza_campagna.py fatti --check plans/coerenza-residui.json "07_il Portale Della Forgia Eterna" "08_La Battaglia Di Hammerfist"

      # Fronti e orologi (DM, 2026-10-23): canone dagli archi nuovi, da ARC-08
      # in poi, un file `ARCnn-FRONTI.yaml` nella cartella dell'arco. ARC-07
      # resta com'è. Senza file il passo non fa niente.
      - name: Fronti e orologi degli archi
        shell: bash
        run: |
          shopt -s nullglob
          f=(*/ARC[0-9][0-9]-FRONTI.yaml)
          if [ ${#f[@]} -eq 0 ]; then echo "nessun file di fronti"; exit 0; fi
          python scripts/coerenza_campagna.py fronti "${f[@]}"

      # Bloccante sugli ERRORI dal 2026-09-24: i refusi sono a zero (11 corretti
      # nella #167, 13 falsi positivi tolti dalla regola). Gli AVVISI (virgolette
      # dritte, «E'») restano ~2.450 e non bloccano: --strict li alzerebbe a
      # errori, e si mette il giorno in cui anche quelli sono a zero. Dal
      # 2026-10-22 se ne stampa solo il conto (l'elenco con --avvisi).
      - name: Lingua italiana — refusi meccanici
        run: python scripts/validate_lingua.py

      # Il passo non bloccante `validate_prosa.py` (calchi, tic a densita') e'
      # uscito il 2026-10-22, lotto 7e di AVVENTURE-COMMUNITY: le stesse regole le
      # ricalcola e le pesa MQM (punteggio_mqm, piu' sotto), che chiama
      # validate_prosa.rilievi sugli stessi file. Le regole restano; il passo
      # che non bloccava niente costava 6 s.

      # BLOCCANTE, soglia zero: il foglio di stile (glossario §8, ADR-0078).
      # Una grafia gia' decisa non torna a scriversi nell'altro modo. Le scelte
      # del DM ancora in sospeso (`DM?`) si contano ma non bloccano.
      - name: Prosa — foglio di stile, zero refusi aperti
        run: python scripts/validate_prosa.py --foglio --strict

      # 🔴 BLOCCANTE, e la ragione sta in ADR-0056: una norma editoriale che
      # nessuno misura non fa rumore quando viene ignorata. «read-aloud-adulti»
      # prescriveva box <= 12 righe da agosto e nessuno guardava; ADR-0014 era
      # stato applicato a UN documento su cento. Questo passo non controlla che
      # le norme siano rispettate — controlla che esista scritto CHI le guarda,
      # e boccia un rimando a uno strumento che non esiste.
      - name: Norme editoriali — ogni norma ha un misuratore o una ragione
        run: python scripts/validate_norme_editoriali.py

      # La guida di Anthropic sulle skill: un reference oltre le 100 righe apre
      # con il suo indice, cosi' un agente che ne legge solo l'inizio sa cosa
      # c'e' e apre la sezione che serve. Generato, mai a mano. ADR-0077 §9.
      - name: Skill — l'indice in testa ai references lunghi
        run: python scripts/indice_references.py --check

      # Il gemello del passo sopra (superficie_norme, ADR-0062) e' dentro
      # validate_norme_editoriali dal 2026-10-22: ogni «non misurato» dice COSA
      # MANCA, e la ragione si rimisura invece di fidarsi della prosa. Il passo
      # separato rifaceva lo stesso controllo una seconda volta.

      # ⚠️ Gira in un passo SUO e per ultimo fra i cancelli editoriali, perche'
      # esegue davvero i comandi che §6.2 cita — e sono i piu' lenti del repo.
      # Il difetto che presidia: i «27 ADR mancanti» erano zero, con il comando
      # che lo smentiva citato accanto alla riga, verde in CI. ADR-0063.
      - name: §6.2 — i comandi citati si eseguono, non si credono
        run: python scripts/verifica_sezione6.py --check

      # Terzo della stessa famiglia: misura la LEGGIBILITA' dell'artefatto, che
      # nessun exit code vede. Gerarchia dei titoli (i segnalibri del PDF),
      # caratteri per riga dalle metriche vere del font, e le coppie di colori
      # che sotto una dicromia diventano lo stesso colore. ADR-0032.
      - name: Tipografia — titoli, caratteri per riga, daltonismo (non bloccante)
        continue-on-error: true
        run: python scripts/validate_tipografia.py

      # ADR-0082, PIANO-COLLAUDO-E-GENERAZIONE-MAPPE V1: il rapporto del collaudo
      # delle mappe, in sola lettura. Non blocca: il gate a tetto e' il lotto V4.
      - name: Collaudo delle mappe (rapporto, non bloccante)
        continue-on-error: true
        run: python scripts/collaudo_mappe.py --solo-errori

      # ADR-0098: lo standard di qualita' delle mappe, misurato sul corpus. Gli
      # errori sono solo fatti (intestazione che mente, direttiva fuori griglia),
      # e il passo non blocca: lo storico ha ancora mappe da rifare.
      - name: Qualita' delle mappe (rapporto, non bloccante)
        continue-on-error: true
        run: python scripts/qualita_mappe.py --solo-errori

      # D23 di RESA-ASSET: la resa delle mappe si misura simbolo per simbolo e
      # terreno per terreno, e nessuna misura peggiora oltre il 5% rispetto a
      # scripts/scheda-resa.json senza che la scheda sia stata riscritta (e
      # quindi passata dal DM nella PR). Rasterizza con il Chrome del runner.
      - name: Resa delle mappe — nessuna misura peggiora (misura_resa)
        run: python scripts/misura_resa.py --check

      - name: DM tool smoke tests
        run: |
          python scripts/inventory_inferred.py --help > /dev/null
          python scripts/suggest_encounter.py --help > /dev/null
          python scripts/suggest_loot.py --help > /dev/null
          python scripts/suggest_map.py --help > /dev/null
          python scripts/session_recap.py --help > /dev/null
          python scripts/state_sync.py --help > /dev/null
          python scripts/build_monster_catalog.py --help > /dev/null
          python scripts/validate_bestiario.py --help > /dev/null
          python scripts/render_map_svg.py --help > /dev/null
          python scripts/compile_map_json.py --help > /dev/null
          python scripts/export_uvtt.py --help > /dev/null
          python scripts/import_ultraclear.py --help > /dev/null
          python scripts/collaudo_mappe.py --help > /dev/null
          python scripts/qualita_mappe.py --help > /dev/null
          python scripts/update_xp.py --check > /dev/null
          python scripts/hype_homebrew.py --help > /dev/null
          python scripts/dm_dossier.py --help > /dev/null
          python scripts/validate_modules.py --help > /dev/null
          python scripts/tools_manifest.py --help > /dev/null
          python scripts/decisioni_dm.py --help > /dev/null
          python scripts/validate_docs.py --help > /dev/null
          # Catena editoriale e da stampa: questi sette dichiaravano `ci_smoke`
          # nel manifest e non venivano eseguiti da nessuno — il contratto
          # prometteva una verifica che non esisteva (ADR-0012).
          python scripts/build_booklet_html.py --help > /dev/null
          python scripts/export_booklet_pdf.py --help > /dev/null
          python scripts/export_booklet_typst.py --help > /dev/null
          python scripts/build_chapter_marks.py --help > /dev/null
          python scripts/extract_scene_prompts.py --help > /dev/null
          python scripts/import_watabou.py --help > /dev/null
          python scripts/campaign_branch.py --help > /dev/null
          python scripts/build_image_derivatives.py --help > /dev/null
          python scripts/validate_booklets.py --help > /dev/null
          python scripts/extract_statblocks.py --help > /dev/null
          # Catena raster e 3D (F3 della ripresa PR). Qui non c'e' GPU, non c'e'
          # Blender e ComfyUI non e' in ascolto: si prova tutto cio' che si puo'
          # provare SENZA — la risoluzione della serie, la composizione dei
          # prompt, la geometria del piano di scena. Il resto e' sulla macchina
          # del DM, e la CI non finge di coprirlo.
          python scripts/comfyui_batch.py --help > /dev/null
          # --lista tiene i «diciotto» a diciotto: le due tavole in piu' sono
          # serie=extra, e al diciannovesimo di serie=base la CI si fa rossa.
          # Non e' un divieto, e' un modo di obbligare a decidere.
          python scripts/comfyui_batch.py --lista > /dev/null
          python scripts/comfyui_batch.py --dry-run > /dev/null
          python scripts/render_map_blender.py --help > /dev/null
          # Il ponte della prosa locale (ADR-0089): come ComfyUI, in CI solo la
          # composizione del prompt; il modello gira sulla macchina del DM.
          python scripts/banco_prosa_locale.py --help > /dev/null
          python scripts/banco_prosa_locale.py corsa --dry-run > /dev/null

      # Tre cose che un --help non prova: che i cancelli MORDANO. Un gate che
      # esiste e non si verifica e' un gate che un giorno smette di funzionare
      # senza dirlo — la stessa classe di difetto di ADR-0043.
      - name: Catena raster — i cancelli mordono
        run: |
          # 1. pesi non commerciali: exit 1 PRIMA di scrivere o chiamare la rete
          if python scripts/comfyui_batch.py --checkpoint flux1-dev.safetensors --dry-run > /dev/null 2>&1; then
            echo "✗ FLUX.1 [dev] e' passato: il cancello di ADR-0019 non morde piu'"; exit 1
          fi
          # 2. un reroll senza motivo non passa: e' il sesto requisito (SCARTI.txt)
          if python scripts/comfyui_batch.py --reroll 1 > /dev/null 2>&1; then
            echo "✗ --reroll senza --motivo e' passato: gli scarti tornano senza traccia"; exit 1
          fi
          echo "✓ pesi vietati rifiutati, reroll senza motivo rifiutato"

      - name: Piano di scena 3D — deterministico
        run: |
          # La geometria si risolve senza Blender e senza GPU, e due giri devono
          # dare lo stesso file: se il piano non e' riproducibile, non lo e'
          # nemmeno l'immagine che ne esce.
          python scripts/render_map_blender.py scripts/examples/esempio-accampamento-mano-rossa.json \
            -o "$RUNNER_TEMP/ci-3d/x.png" --piano-solo
          cp "$RUNNER_TEMP"/ci-3d/*.piano.json "$RUNNER_TEMP/piano-1.json"
          python scripts/render_map_blender.py scripts/examples/esempio-accampamento-mano-rossa.json \
            -o "$RUNNER_TEMP/ci-3d/x.png" --piano-solo
          cmp "$RUNNER_TEMP/piano-1.json" "$RUNNER_TEMP"/ci-3d/*.piano.json
          echo "✓ piano 3D byte-identico su due giri"

      - name: Manifest dei booklet (schema, file, immagini, parità fra le catene)
        run: python scripts/validate_booklets.py --spiega


      - name: Install typst (versione FISSATA, mai «latest»)
        # Un compilatore che si aggiorna da solo è una CI che diventa rossa di
        # notte per una riga che nessuno ha scritto. La versione si alza a mano,
        # in un commit che si vede. ADR-0020 §3.
        env:
          TYPST_VERSION: "0.15.1"
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Edizione da stampa — i volumi compilano DAVVERO (ADR-0020)
        # Il gate che mancava: senza typst in CI, due booklet della campagna non
        # avevano mai compilato e nessuno poteva accorgersene. Ora ogni manifest
        # del repo produce un PDF vero, con i segnalibri.
        # I volumi di un corredo li compila e li misura il passo dopo
        # (validate_corredo --stampa, con gli stessi controlli di guscio e
        # segnalibri): compilarli anche qui li faceva due volte, 79 s su 230.
        run: python scripts/validate_booklets.py --stampa --salta-corredo

      - name: Il corredo della serata (pezzi, doppioni, box, e i suoi PDF misurati)
        # rumblingstone-automation, «Il corredo della serata»; ADR-0070. Con
        # --stampa compila i volumi del corredo e li misura con PyMuPDF
        # (requirements-dev.txt, D7 di CICLO-SESSIONE): righe sovrapposte, testo
        # sul bordo, apparato di lavoro. --rigoroso: una misura saltata è rossa.
        run: python scripts/validate_corredo.py --stampa --rigoroso

      - name: Schede pregenerate — un PDF per giocatore
        run: |
          python scripts/export_booklet_typst.py \
            10-stand-alone/Il-Drappo-di-Tarsilia/homebrew/DRAPPO-SCHEDE-PG.manifest.json \
            --per-scheda
          test "$(ls 10-stand-alone/Il-Drappo-di-Tarsilia/homebrew/schede/*.pdf | wc -l)" -eq 6

      - name: Map JSON contract + UVTT export round-trip (M1/M2)
        run: |
          python scripts/compile_map_json.py scripts/examples/esempio-accampamento-mano-rossa.json --validate-only
          python scripts/compile_map_json.py scripts/examples/esempio-accampamento-mano-rossa.json -o /tmp/ci-map.md
          python scripts/render_map_svg.py /tmp/ci-map.md > /dev/null
          python scripts/export_uvtt.py /tmp/ci-map.md -o /tmp/ci-vtt
          python -c "import json,glob; d=json.load(open(glob.glob('/tmp/ci-vtt/*.uvtt')[0])); assert d['line_of_sight'] and d['portals'] and d['lights'], 'UVTT vuoto'; print('UVTT OK:', len(d['line_of_sight']),'muri')"
          # overlay professionale (bussola/movimenti/callout/zone) dal JSON
          python scripts/compile_map_json.py scripts/examples/campo-drow-1.json -o /tmp/ci-drow.md
          python -c "t=open('/tmp/ci-drow.md',encoding='utf-8').read(); assert '@north' in t and '@path' in t and '@mark' in t and '@zone' in t, 'direttive @ mancanti'; print('direttive @ OK')"
          # import ultra-clear → bozza JSON compilabile (fixture pulita, exit 0)
          python scripts/import_ultraclear.py scripts/tests/fixtures/ultraclear/uniform.md -o /tmp/ci-uc.draft.json --json-report /tmp/ci-uc.conflicts.json -q
          python scripts/compile_map_json.py /tmp/ci-uc.draft.json --validate-only
          python -c "import json; r=json.load(open('/tmp/ci-uc.conflicts.json')); assert r['report_version'] and 'conflicts' in r, 'report malformato'; print('import_ultraclear OK')"

      # ADR-0059: il punteggio pesato. Nasce verde per costruzione (la soglia
      # viene dalla distribuzione misurata del repo), quindi un rosso qui e' un
      # documento che e' peggiorato, non una soglia importata da un manuale.
      - name: Punteggio di qualita' editoriale (MQM, ADR-0059)
        run: |
          python scripts/punteggio_mqm.py --soglia
          python scripts/validate_modules.py --tetto-el
          # ADR-0077, estensione: nessuna revisione applicata ha peggiorato la misura
          python scripts/ciclo_prosa.py registro --check

      # Un corridore solo (D2 di PIANO-PIATTAFORMA, DM 2026-10-23). Fino a quel
      # giorno le stesse prove giravano due volte, con unittest e con pytest:
      # 222 s su 914 del job per rieseguire cio' che pytest aveva gia' eseguito.
      # Il difetto del 2026-09-21 (966 prove viste, 942 eseguite) resta
      # presidiato da `test_i_test_girano_in_ci.py`, che conta le prove dei due
      # corridori senza eseguirle e boccia se non combaciano: un test che
      # unittest non vedrebbe fa ancora rossa la CI.
      - name: Unit tests — pytest (ADR-0037 em. 2026-09-21 e 2026-10-23)
        run: python -m pytest scripts/tests -q

      - name: dm.py unified CLI smoke test (K-C3)
        run: |
          python scripts/dm.py --help > /dev/null
          python scripts/dm.py doctor --ci

      # Il server MCP (ADR-0030) e' una superficie d'esecuzione: il gate verifica
      # che ogni tool del catalogo costruisca una riga di comando valida e senza
      # metacaratteri di shell, e poi lo fa parlare davvero sul suo trasporto.
      # Un server che passa i test interni ma non risponde a `tools/list` non
      # serve a niente.
      - name: Server MCP — catalogo, difese e protocollo
        run: |
          python scripts/mcp_server.py --self-check
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"state_apply","arguments":{}}}' \
            | python scripts/mcp_server.py > /tmp/mcp-out.jsonl
          python - <<'EOF'
          import json
          r = [json.loads(x) for x in open("/tmp/mcp-out.jsonl")]
          assert r[0]["result"]["protocolVersion"], "initialize senza versione"
          n = len(r[1]["result"]["tools"])
          assert n >= 40, f"tools/list ne espone solo {n}"
          assert all("annotations" in t for t in r[1]["result"]["tools"]), "annotazioni mancanti"
          # in sola lettura, chi scrive canone deve essere RIFIUTATO (S-5)
          assert "error" in r[2], "state_apply è partito in sola lettura"
          print(f"server MCP OK — {n} tool, annotazioni presenti, S-5 attiva")
          EOF

  # ADR-0099, canale TESTING (D3 e D4 di PIANO-PIATTAFORMA, DM 2026-10-23):
  # la stessa suite installata con uv ed eseguita in parallelo con
  # pytest-xdist. Non blocca la PR. Sale a stable, e sostituisce il passo
  # pytest e `pip install` del job principale, dopo 14 giorni e 10 run su main
  # con le stesse prove passate e nessun test instabile in parallelo. I tempi
  # da confrontare sono quelli dei passi «Installa con uv» e «pytest -n auto»
  # contro «Install dependencies» e «Unit tests» del job principale.
  testing:
    name: Piattaforma in prova (uv, pytest-xdist) — non bloccante
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # come nel job principale: test_fase1 legge i rami

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installa uv (versione fissata)
        run: pip install "uv==0.11.32"

      - name: Installa con uv
        run: uv pip install --system -r requirements-dev.txt

      - name: Stessi pacchetti di pip (nomi e versioni)
        run: |
          # Il confronto che dice se uv installa cio' che installerebbe pip.
          # I nomi si normalizzano come PEP 503 (pip scrive «PyYAML», uv
          # «pyyaml»); uv, pip e setuptools sono gli strumenti, non il contenuto.
          norm() { sed -E 's/[-_.]+/-/g' | tr 'A-Z' 'a-z' | grep -v -E '^(uv|pip|setuptools|wheel)==' | sort; }
          uv pip freeze --system | norm > "$RUNNER_TEMP/uv.txt"
          python -m venv "$RUNNER_TEMP/pipvenv"
          "$RUNNER_TEMP/pipvenv/bin/pip" install -q -r requirements-dev.txt
          "$RUNNER_TEMP/pipvenv/bin/pip" freeze | norm > "$RUNNER_TEMP/pip.txt"
          diff "$RUNNER_TEMP/pip.txt" "$RUNNER_TEMP/uv.txt" && echo "✓ stessi pacchetti"

      # Due giri: in parallelo tutto tranne i test che scrivono per un momento
      # nel repo vero, poi quelli in serie (scripts/tests/conftest.py). Insieme
      # sono la stessa suite del job principale.
      - name: pytest -n auto
        run: |
          python -m pytest scripts/tests -q -n auto -m "not scrive_nel_repo"
          python -m pytest scripts/tests -q -m scrive_nel_repo

  # D6 di PIANO-PIATTAFORMA (DM, 2026-10-23: «D6 b»): i convertitori entrano
  # nella piattaforma, in canale TESTING. ruff li guarda gia' nel job
  # principale; qui si installano le loro dipendenze vere (torch per CPU, come
  # in requirements-completo.txt) e si prova che ogni modulo si importi su
  # Python 3.13. La misura del 2026-10-23: 12 moduli su 20 senza torch, uno
  # (fallback_manager) rotto da un NameError all'import, ora corretto. I test
  # del motore leggono PDF che non stanno nel repo e qui non girano.
  convertitori:
    name: Convertitori in prova (import su 3.13) — non bloccante
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installa uv (versione fissata)
        run: pip install "uv==0.11.32"

      - name: Dipendenze dei convertitori (torch per CPU)
        run: |
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r converters/pdf-to-md-engine/requirements.txt \
            -r converters/Html_to_markdown/requirements.txt

      - name: Ogni modulo del motore PDF si importa
        working-directory: converters/pdf-to-md-engine
        # src/config.py legge le due cartelle all'import (pydantic-settings,
        # di solito da .env): qui bastano due cartelle qualsiasi.
        env:
          INPUT_DIR: /tmp/convertitori-in
          OUTPUT_DIR: /tmp/convertitori-out
        run: |
          python - <<'EOF'
          import importlib, pathlib, sys
          sys.path.insert(0, ".")
          rotti = []
          moduli = sorted(pathlib.Path("src").glob("*.py"))
          for f in moduli:
              try:
                  importlib.import_module("src." + f.stem)
              except Exception as e:
                  rotti.append(f"src.{f.stem}: {type(e).__name__}: {e}")
          print(f"{len(moduli) - len(rotti)} moduli su {len(moduli)} si importano")
          for r in rotti:
              print("  ✗", r)
          sys.exit(1 if rotti else 0)
          EOF

      - name: Il convertitore HTML parte
        run: python converters/Html_to_markdown/html_to_markdown_converter.py --help > /dev/null

  # Le misure di stampa dei booklet (piano dello standard di stampa, PR #295):
  # corpo minimo, testo oltre la gabbia, immagini sotto 300 dpi, riquadri di
  # creatura spezzati fra due pagine, font non incorporati. Ogni booklet ha i
  # suoi tetti in docs/audit/stampa-booklet.json e nessuna misura può salire.
  # Job a parte perché ricompila i 17 volumi (circa 3 minuti): gira accanto a
  # «validate» e non ne allunga il tempo.
  stampa-misurata:
    name: Misure di stampa dei booklet (misura_stampa)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install typst (la stessa versione fissata di «validate»)
        env:
          TYPST_VERSION: "0.15.1"
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      - name: Nessun booklet sopra i suoi tetti di stampa
        run: |
          set -o pipefail
          { echo "## Misure di stampa dei booklet"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python scripts/misura_stampa.py --tutti --check | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ADR-0103, canale TESTING: le regole dei master ARC-08 riscontrate sull'SRD
  # 3.5 e sul PRD PF1e (OGL), scaricati da raw.githubusercontent.com a commit
  # fissato con lo sha256 di ogni file (circa 50 MB, nessuna azione di cache:
  # sarebbe un componente nuovo). Il rapporto va nel riepilogo del run. Le
  # discordanze le decide il DM, quindi niente --strict: il passo diventa
  # rosso solo se lo strumento si rompe (1 sha256 sbagliato, 2 file dei
  # riscontri rotto, 3 rete assente). Sale a stable dopo 14 giorni e 10 run.
  riscontro-srd:
    name: Riscontro SRD in prova (ARC-08) — non bloccante
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scarica le fonti a commit fissato
        run: python scripts/riscontro_srd.py --cache "$RUNNER_TEMP/srd" scarica

      - name: Riscontra DEF-1 e DEF-2
        run: |
          python scripts/riscontro_srd.py --cache "$RUNNER_TEMP/srd" --offline riscontra \
            plans/esperimenti/ricerca-rete-2026-10-23/riscontri-arc08.yaml \
            --md "$RUNNER_TEMP/riscontro.md"
          { echo "## Riscontro SRD di ARC-08 (ADR-0103, testing)"; echo; cat "$RUNNER_TEMP/riscontro.md"; } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build skill packages
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build all per-agent skill packages
        run: ./scripts/build-skills.sh --no-deploy

      - name: Upload packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: skill-packages
          path: build/
          retention-days: 14
