# specifiche-qualita.yaml — le specifiche di qualità dichiarate, fuori dal codice.
#
# ⚠️ Questo file è una decisione di prodotto, non un dettaglio di implementazione:
# il DM deve poter cambiare una soglia senza toccare Python. Lo legge
# `scripts/punteggio_mqm.py` (ADR-0059), che senza di esso non parte.
#
# Il modello è MQM adattato (ISO 5060): un errore è il **mancato rispetto di una
# specifica dichiarata**, non «una cosa brutta». Le specifiche sono le norme già
# registrate in `skills/REGISTRO-NORME-EDITORIALI.md`; qui ognuna prende un peso.
#
# Fonte del disegno: plans/PIANO-MISURA-EDITORIALE-STANDARD.md §3-§4.

versione: 1

# ── Le severità, con i moltiplicatori canonici MQM ───────────────────────
severita:
  critico:
    peso: 25
    # ⛔ Pass/fail ASSOLUTO: un solo critico boccia il documento qualunque sia
    # il punteggio. È la differenza principale rispetto a `misura_craft`, dove
    # oggi tutto pesa uguale.
    pass_fail: true
    cos_e: "rende il documento ingiocabile, o viola il canone (AGENTS.md regola 8)"
  maggiore:
    peso: 5
    pass_fail: false
    cos_e: "viola una norma prescrittiva registrata"
  minore:
    peso: 1
    pass_fail: false
    cos_e: "un congegno assente dove sarebbe servito, o una prassi disattesa"

# ── Le norme, e chi le rileva ────────────────────────────────────────────
#
# 🔴 **Una norma entra qui solo se un rilevatore che esiste già la misura.**
# È il criterio «una norma, un rilevatore»: questo strumento non ne scrive di
# nuovi, riusa quelli del repo. Le norme registrate senza rilevatore restano
# fuori, e `punteggio_mqm.py --norme` le elenca invece di fingere che valgano 0.
norme:
  box_oltre_12_righe:
    severita: maggiore
    rilevatore: "misura_craft.difetti_dei_box"
    norma: "read-aloud-adulti.md §2 — box ≤ 12 righe"
  box_con_parentesi:
    severita: minore
    rilevatore: "misura_craft.difetti_dei_box"
    norma: "read-aloud-adulti.md §1 — niente parentesi né incisi lunghi"
  box_piu_di_un_nome_proprio:
    severita: minore
    rilevatore: "misura_craft.difetti_dei_box"
    norma: "read-aloud-adulti.md §1 — un solo nome proprio nuovo per box"
  caratteristica_minuscola:
    severita: minore
    rilevatore: "validate_prosa.controlla_caratteristiche"
    norma: "ADR-0060 — caratteristiche e abilità maiuscole nelle quattro forme"

# ── I tre casi critici, e quale dei tre è decidibile ─────────────────────
#
# Il DM, il 2026-09-21: *«non sarebbe opportuno creare questo verificatore? Ci
# sono le regole 3.5 e PF1e come skill nel repo, non si possono usare per farlo
# in maniera deterministica?»*. Misurato, la risposta è **uno su tre**, e la
# ragione degli altri due va scritta invece di lasciarli vuoti.
#
#   ⛔ EL oltre APL+4 senza `Boost log:`
#      → DECIDIBILE, ed è aritmetica: APL da `campaign/state.md` (ADR-0038),
#        EL dal file, tetto da `skills/npc-villain-boosting/`, deroga
#        dichiarata. Rilevatore: `validate_modules.py --tetto-el`.
#      🔴 **E non entra ancora nel punteggio**, per un motivo misurato: la
#        forma che `AGENTS.md` prescrive per gli incontri — `**EL**: [N]` — ha
#        **ZERO occorrenze** nel repo. I 150 «EL N» esistenti sono in forma
#        nuda e mescolano dichiarazioni («Boss Fight - EL 14») con menzioni
#        («Standard Treasure for EL 16»). Il controllo esiste, gira, e dice
#        che non ha superficie: marcare gli incontri è un lotto, e il giorno
#        in cui è fatto questa norma si accende da sola.
#
#   🟡 contraddizione con `state.md`
#      → decidibile solo in forme strette (un punteggio permanente di un PG
#        che contraddice la scheda — il difetto «−2 COS» del 2026-09-19), non
#        in generale. Mezzo rilevatore che si spaccia per intero è peggio di
#        nessuno.
#
#   🔴 statblocco inventato
#      → NON decidibile. Le skill SRD dicono cosa **esiste**, non se i numeri
#        di un PNG originale sono coerenti; un rilevatore lo confonderebbe con
#        «PNG non nel Bestiario», che è un'altra cosa e ha già il suo gate.
#
# Quindi oggi il meccanismo pass/fail è **cablato e non scatta mai**: pronto,
# non attivo. Il test lo prova su una specifica di prova (ADR-0059).

# ── Le classi di documento ───────────────────────────────────────────────
#
# Un master DEF da 1.300 righe e un handout da 40 non si confrontano: il
# punteggio è normalizzato per 1.000 righe e la soglia è per classe.
classi:
  master_def:
    descrizione: "i cinque master definitivi dell'arco"
    modelli: ["*/ARC*-DEF-*.md", "ARC*-DEF-*.md"]
  arco:
    descrizione: "tutto il resto del contenuto di gioco"
    modelli: ["0*/*", "1*/*", "STANDALONE-*/*", "PG/*", "Bestiario/*",
              "0*/*/*", "1*/*/*", "STANDALONE-*/*/*", "PG/*/*", "Bestiario/*/*",
              "0*/*/*/*", "1*/*/*/*", "PG/*/*/*", "Bestiario/*/*/*",
              "0*/*/*/*/*", "PG/*/*/*/*", "PG/*/*/*/*/*"]
  documento:
    descrizione: "guide, ADR, piani, skill — norme diverse (ADR-0035)"
    modelli: ["plans/*", "plans/*/*", "docs/*", "docs/*/*", "skills/*", "skills/*/*", "skills/*/*/*"]
  campagna:
    # 31 file: playbook, stato, log di sessione, recap, prompt. Sono un misto —
    # il playbook parla al DM, un recap parla ai giocatori — e finche' non sono
    # separati non hanno una soglia sensata. Si misurano e non si bocciano:
    # dichiararlo e' meglio che lasciarli «fuori classe» senza che si sappia.
    descrizione: "campaign/ — playbook, stato, sessioni, recap (classe mista)"
    modelli: ["campaign/*", "campaign/*/*", "campaign/*/*/*"]

# ── Le soglie ────────────────────────────────────────────────────────────
#
# 🔎 **Nascono dal repo, non da un manuale.** La regola di taratura del piano
# (§4) è: la soglia iniziale è il valore che il repo ha già, arrotondato in
# basso, così il cancello **nasce verde** e non butta via niente. Da lì si
# stringe per gradi, e ogni stretta porta la sua ragione scritta (ADR-0036).
#
# I numeri sotto vengono da `punteggio_mqm.py --distribuzione`, eseguito il
# 2026-09-21 (lotto F1.4). Rimisurarli con lo stesso comando prima di cambiarli.
# 🔴 **Le prime soglie che ho scritto qui erano inventate** — «P25 99,7»,
# «P10 97,8» — messe prima di eseguire F1.4, cioe' esattamente il difetto che
# questo piano esiste per non ripetere. I numeri veri sono sotto, e il comando
# che li produce e' nella riga di ogni voce.
soglie:
  master_def:
    # F1.4 (2026-09-21, 5 file): P10 97,51 · P25 97,90 · P50 98,26 · P75 99,12
    # · min 97,25.  Soglia = P25 arrotondato in basso.
    punteggio_minimo: 97.0
    critici_ammessi: 0
    prossima_stretta: 97.9   # il P25 pieno, quando i 5 master lo superano tutti
  arco:
    # F1.4 (2026-09-21, 479 file): P10 100,00 · P25 100,00 · P50 100,00 ·
    # P75 100,00 · min 88,41.
    # ⚠️ Qui la regola «soglia = P10» NON si applica: la distribuzione e' cosi'
    # schiacciata sul 100 che il P10 e' 100, e usarlo boccerebbe la coda —
    # contro l'istruzione del DM «una soglia che non butti via niente». La
    # soglia nasce quindi dal **minimo**, arrotondato in basso: verde per
    # costruzione. La stretta successiva e' dichiarata e non ancora applicata.
    punteggio_minimo: 88.0
    critici_ammessi: 0
    prossima_stretta: 95.0   # boccerebbe oggi 5 file su 479: si stringe quando sono 0
  campagna:
    # Classe mista, nessuna soglia finche' non e' separata. Solo il pass/fail.
    punteggio_minimo: null
    critici_ammessi: 0
  documento:
    # Le norme dei documenti sono altre (ADR-0035) e le misura
    # `validate_prosa --documenti`. Qui vale solo il pass/fail sui critici.
    punteggio_minimo: null
    critici_ammessi: 0
