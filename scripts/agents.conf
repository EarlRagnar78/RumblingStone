# scripts/agents.conf — la matrice degli agenti, scritta una volta sola.
#
# La leggono (`source`) build-skills.sh e sync-skills.sh. Prima ognuno aveva la
# sua copia, e AGENTS.md una terza: aggiungere o rinominare un agente voleva
# dire toccarne tre. Questo file era nato nella review della PR #1
# (2026-05-02) ed era stato spinto sul ramo DOPO il merge, quindi non era mai
# arrivato su main; rifatto sul codice di oggi il 2026-09-24 (decisione D22
# di PIANO-RIPRESA-PR-ABBANDONATE). test_agents_conf.py verifica che i due
# script non abbiano una matrice propria e che AGENTS.md dica le stesse cose.
#
# Array associativi di Bash 4+.
#
# AGENT_FORMAT[<id>]        formato prodotto da compress_skills.py:
#                           compact.md · structured.yaml · machine.json
# AGENT_INSTALL_PATHS[<id>] radice d'installazione per l'utente; ogni skill
#                           diventa <radice>/<skill>/. Facoltativa: senza
#                           voce l'agente non si installa a livello utente.
# AGENT_REPO_ROOTS[<id>]    radice dello specchio dentro il repo, per
#                           sync-skills.sh (gitignorata).
# AGENT_INDEX_AWARE[<id>]   "1" solo se il loader dell'agente legge davvero
#                           index.json. Oggi nessuno lo fa: vuoto.

declare -A AGENT_FORMAT=(
  ["claude"]="compact.md"
  ["gemini"]="structured.yaml"
  ["codex"]="machine.json"
  ["chatgpt"]="compact.md"
  ["cursor"]="machine.json"
  ["windsurf"]="compact.md"
  ["copilot"]="compact.md"
)

declare -A AGENT_INSTALL_PATHS=(
  ["claude"]="${HOME}/.claude/skills"
  ["codex"]="${HOME}/.codex/skills"
  ["cursor"]="${HOME}/.cursor/skills"
  ["windsurf"]="${HOME}/.windsurf/skills"
)

declare -A AGENT_REPO_ROOTS=(
  ["claude"]=".claude/skills"
  ["codex"]=".agents/skills"
  ["cursor"]=".cursor/skills"
  ["windsurf"]=".windsurf/skills"
  ["copilot"]=".github/copilot/skills"
  ["chatgpt"]=".chatgpt/skills"
  ["gemini"]=".gemini/skills"
)

declare -A AGENT_INDEX_AWARE=()
