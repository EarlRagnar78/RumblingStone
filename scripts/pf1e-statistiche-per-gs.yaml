# Tabella 1–1 del Bestiary di Pathfinder 1e: statistiche dei mostri per GS.
#
# Fonte: Pathfinder Roleplaying Game Bestiary, «Monster Creation», Table 1–1,
#        contenuto aperto OGL 1.0a. Letta il 2026-09-23 da
#        https://www.d20pfsrd.com/bestiary/rules-for-monsters/monster-creation/
#        e trascritta riga per riga dall'HTML, non a memoria.
#
# Perche' e' un file e non una costante nel codice: il repo ne aveva due copie
# (`PER_GS` in dmcore/tabelle.py e `PF_BENCH` in validate_bestiario.py) che non
# concordavano nemmeno nella forma, e le otto righe dichiarate «verificate»
# sbagliavano danno, CD e TS cattivo. Un dato che il DM puo' correggere sta
# dove il DM lo legge.
#
# ⚠️ GS 22: la fonte scrive 400 pf, come il GS 21. La progressione (+40 per
# passo dal 20 al 30) fa pensare a 440. Si trascrive la fonte e lo si dice: la
# campagna non arriva a quel GS.
#
# Forma: una riga per GS, tutti i campi in chiaro. Il lettore e'
# dmcore/tabelle.py (solo stdlib, nessun pyyaml).
versione: 1
data: 2026-09-23
colonne: [gs, pf, ca, attacco_alto, attacco_basso, danno_alto, danno_basso, cd_primaria, cd_secondaria, ts_buono, ts_cattivo]

# Quanto lontano dal bersaglio un mostro 3.5 e' ancora «in scala» per
# validate_bestiario --rules. Il 3.5 sta sotto il PF1e a parita' di GS
# (ADR-0033), quindi la fascia e' larga e asimmetrica: fuori scala e' chi ha
# meno di un terzo dei pf del bersaglio o piu' del triplo, o una CA di oltre
# 10 punti sotto o 6 sopra. Col vecchio PF_BENCH, che non dichiarava la fonte,
# gli avvisi erano 3; con questa regola sono 5: quattro incantatori con pochi
# pf e un cavaliere gnoll da 11 pf a GS 4 (misurato il 2026-09-23).
tolleranza:
  pf_rapporto_min: 0.3
  pf_rapporto_max: 3.0
  ca_sotto: 10
  ca_sopra: 6

