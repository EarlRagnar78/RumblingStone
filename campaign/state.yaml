party:
- pg: Thorik
  classe: Dwarf Fighter 13
  oggi: Sala della Forgia Eterna, dopo il riposo (orologio Hammerfist **3g 16h**)
  preparato: Hammerfist Holds, war council chamber
  hp: 'Full. **−4 DES / +2 COS / +4 CAR permanenti**, e sono tutto quel che ha pagato: −2 DES dalla Corona quando l''ha indossata, −2 DES / +2 COS / +4 CAR dal rito dello Smeraldo del 2026-07-31 (è il **portatore** ad aver accettato il Peso del Mondo). Ricalcolare CA senz''armatura, Riflessi, iniziativa. ⚠️ **Nessun −2 COS.** Il costo della resurrezione è **non ancora versato**: la scena (`ARC07-DEF-3` §5) non è stata giocata. Quando la giocherà, dona il **+2 di deflessione della Corona** e resta a **−1 CA permanente** — e ogni volta che Hella userà lo **Scudo del Custode**, lui sarà **accelerato 3 round verso chi lei ha protetto**. Può anche **rifiutare**: allora Aegis Fang (Ego 14) lo **giudica** finché non rischia qualcosa di suo per lei'
  filoni: Decide whether to lead defense of Rethmar personally vs. delegate
- pg: Tordek
  classe: Dwarf Fighter 4 / Monk 9
  oggi: Sala della Forgia Eterna, dopo il riposo
  preparato: → Torneo di Dauth
  hp: 'Full; Bracieri Earth phase complete. ✅ **Nessun malus permanente dal rito**: il Peso del Mondo l''ha accettato **Thorik**, il portatore (correzione DM 2026-08-06 — fino a quella data il pegno era attribuito a Tordek per errore). CA senz''armatura, Riflessi, iniziativa e Raffica restano quelli di prima. ⚠️ Il costo della resurrezione è **non ancora versato**, e 🔎 **non sono più i «−500 PE»**: in v4-bis dona **Ancoraggio della Montagna** (2/g), che **lascia i Bracieri per sempre** → Hella ottiene **RD 3/adamantino**. Se rifiuta, i Bracieri **tacciono una settimana**'
  filoni: Tournament of the Eight Gates (3 days, interrupted by Githyanki Day 3)
- pg: Hella
  classe: Dream Dwarf Ranger 1 / Druid 12
  oggi: 🔴 **morta**, corpo nella Sala, semi innestati — la resurrezione (P3B / `ARC07-DEF-3`) è **il prossimo beat da giocare**
  preparato: Hammerfist → Foresta Sacra, template Ibrido Treant attivo, PG a pieno titolo
  hp: n/d finché non torna. Il template Ibrido Treant e i tre Doni **si assegnano al rito**, non prima
  filoni: Sacred Forest ritual (pass = druid circle ally at Rethmar)
- pg: Artemis
  classe: Human Warlock 13
  oggi: Sala della Forgia Eterna, dopo il riposo
  preparato: → Torre Invisibile (regione di Dauth)
  hp: 'Full; Ring of Chaotic Illumination active, **Eldritch Blast 7d6**. ⚠️ Il costo del rito è **non ancora versato**: dona **1d6 di Eldritch Blast** (7d6 → **6d6**, per sempre) → Hella ottiene **il Rovo Eldritch**, a volontà. Se rifiuta, l''Anello **si spegne 24 ore**'
  filoni: Confront Zalkatar (CR 13 illithid warlock); Ring evolution at stake
artefatti:
- artefatto: Aegis Fang
  portatore: Thorik
  oggi: 'Pre-full-awakening: +2 Returning Dwarven Waraxe; bonded'
  preparato: Unchanged until the Siege (P5) is won → then Stage 1 full awakening (see Aegis master)
- artefatto: Corona di Adamantio
  portatore: Thorik
  oggi: '✅ **Topazio + SMERALDO accesi** e **Rituale Legacy 3 «Incudine del Mondo» COMPLETATO** (giocato 2026-07-31). Poteri attivi: Stone''s Awareness (incl. traps + comprehend languages), +2 deflection AC, Moradin''s Insight, Topazio 1/mese (attivazione 1 ora), **Smeraldo/Terra 1/settimana**, e i due sbloccati dal Rituale 3 — **Adamantine Will** (immune charme/compulsione + 4 razziale vs mentale su pietra) e **Mantle of Stone and Spirit** (**Mind Blank permanente**, RD 5/epico, Comunione 1/mese da un Nodo). ✅ Il pegno del Rituale 3 l''ha versato **Thorik**, il portatore (−2 DES / +2 COS permanenti) — correzione DM 2026-08-06: fino a quella data era attribuito a Tordek per errore. ⚠️ Si somma al **−2 DES** che la Corona gli aveva già preso quando l''ha indossata (`PortaleForgia-P1-REVISED-Corretta.md`, «Limitazioni»). **Totale: −4 al punteggio** (DES 10 → 8 → 6), che sono **−2 al modificatore** (da +0 a −2): −2 a CA, Riflessi, iniziativa e prove di DES. In cambio **+4 CAR** (8 → 12) e **+2 COS**. 🔒 **Non rimovibile volontariamente** finché mancano gemme (DM 2026-09-04): l''unica volta che è uscita dalla testa è stato **per incastonare lo Smeraldo**. Mancano Corona +3, Senzienza e il Rubino: si sbloccano col **Rituale 4** = viaggio a −1.000'
  preparato: 'All 3 gems lit: + Emerald earthquake 1/week; Ruby single-use SPENT at the ancient battle (≈372 DR)'
- artefatto: Ring of Chaotic Illumination
  portatore: Artemis
  oggi: 'Reforged at Eternal Forge: full base powers'
  preparato: Unchanged; awaits further evolution at Invisible Tower
- artefatto: Bracieri Gemelli di Moradin
  portatore: Tordek
  oggi: 'Fire ✅ + Earth ✅: Salto Infuocato 3/day, Fire Resist 10, DR 5/adamantine, Jump +10; Benedizione della Forgia active (4 charges/day — permanent, DM 2026-07-04); **Ancoraggio della Montagna 2/day** (immediata, nega il movimento forzato). ⭐ **NUOVO 2026-07-31 — «Diventare una Collina»** sbloccato dalla caduta di Terros: taglia Grande 1 min, 1/giorno, **prima attivazione automatica e gratuita** quando uno scontro con una creatura Enorme+ porta Tordek sotto metà pf; dopo, azione di movimento **solo in condizioni di pericolo**'
  preparato: Unchanged
- artefatto: Cintura della Devastazione (custom PG, D17)
  portatore: Tordek
  oggi: 'Active — Devastation Gauntlets (MIC) moved to **belt slot** so wrists stay free for the Bracieri; ~3/day devastation charges (+2d6). Sheet: `PG/Artefatti/Artefatti-Pg/Tordek/00_Cintura_della_Devastazione.md`. Exact values → ARC-07 B5'
  preparato: Unchanged
- artefatto: Collana dei Semi Eterni
  portatore: Hella (dead — resurrection pending)
  oggi: Forged, awaiting the P3B ritual; Hella not yet resurrected
  preparato: 'Active post-resurrection: Treant summoning (limited), Avatar form (1/day). **I 3 slot-dono hanno una meccanica dal 2026-09-12** (`ARC07-DEF-3` §5, DM): ogni PG dona **un potere del proprio artefatto**, che lo lascia per sempre e **germoglia in un seme** — Thorik il **+2 di deflessione** → *Scudo del Custode*; Tordek l''**Ancoraggio** → *Pelle di Adamantio* RD 3/adamantino; Artemis **1d6 di Eldritch Blast** → *Rovo Eldritch* a volontà. 🌱 E il seme **restituisce** al donatore ciò che ha ricevuto, **una volta sola**, quando Hella decide. Slot **ancora non spesi**: il rito non è stato giocato'
- artefatto: Cuore di Moradin
  portatore: Crown set (altar)
  oggi: Intact — will be expended as catalyst in the P3B ritual
  preparato: 'SPENT: single-use expended to resurrect Hella'
- artefatto: Orbe delle Otto Porte (Githyanki artifact, campaign canon)
  portatore: Tournament prize, not yet held
  oggi: Not in play
  preparato: Awaits Tournament outcome — N/A until Tordek wins
echi:
- id: E-07a
  data: '2026-07-31'
  autore: Artemis
  fatto: prende il Seme-Mercato di Varis ma **non lo tocca**, e lo fa portare a **Tordek**
  tono: grigio
  miccia: lunga (ARC-09)
  payoff: 'Varis scopre di essere stato riconosciuto e trattato da pari: apre una **trattativa**, non una riscossione. E il giorno in cui serve un favore, la gemma è già in mano al party — sulla schiena sbagliata'
  stato: armato
  tag: 🔫 armato
- id: E-07b
  data: '2026-07-31'
  autore: Tordek
  fatto: porta nello zaino un innesto planare **senza sapere cosa sia**
  tono: grigio/inquieto
  miccia: media
  payoff: Il primo che tocca il Seme se ne prende il Marchio. Se è Tordek, Varis gli offre **certezze** invece che tesori — l'esca giusta per un monaco che ha perso una compagna
  stato: armato
  tag: 🔫 armato
- id: E-07c
  data: '2026-07-31'
  autore: Thorik
  fatto: 'Al rito dello Smeraldo gli viene chiesto **«un pezzo di te stesso»**, e **non lo delega**: si inginocchia sotto il Peso invece di comprarne l''uscita col bottino dell''arco. −2 DES / +2 COS permanenti.'
  tono: luminoso, costoso
  miccia: media
  payoff: '**Ha pagato dove non si vede, e lo applaudono per la metà che si vede.** La DES era già la sua statistica povera — **10 di base**, e la Corona gliene aveva già tolti 2 quando se l''è messa in testa: questi altri due la portano a **6 di punteggio** (−4 in tutto), che al tavolo sono **un punto solo** di CA, Riflessi e iniziativa in più rispetto a ieri. Nessuno al tavolo lo noterà. Il +2 COS invece lo rende *più bravo* nell''unica cosa per cui lo misurano — reggere. Riemerge la prima volta che un nano di Hammerfist (o Re Thorek) lo elogia per quanto sa incassare e **lui non corregge nessuno**: l''unico che sa il prezzo è lui. Poi paga davvero quando al party viene chiesto un altro pegno e **Thorik si muove per primo**, perché adesso conosce il cambio e non si fida a lasciarlo accettare a un altro.'
  stato: armato
  tag: 🔫 armato
- id: E-07e
  data: '2026-07-31'
  autore: Tordek
  fatto: «Guarda il portatore pagare» — eco mai realmente esistita.
  tono: null
  miccia: null
  payoff: 'Annullata il 2026-08-09. Nasceva dall''attribuzione sbagliata del pegno — era «il portatore guarda un altro reggere il peso» — e il 2026-08-06 era stata semplicemente rovesciata su Tordek. Ma un''eco registra **una scelta**, e Tordek qui non ne ha fatta nessuna: non gli è stato chiesto niente e non ha rinunciato a niente. Rovesciare un''eco non la rende vera. L''ID **non si riusa**; le righe vive di Tordek restano E-07a/E-07b. Rimpiazzata da E-07f.'
  stato: annullata
  tag: ✖ annullata
- id: E-07f
  data: '2026-07-31'
  autore: Thorik
  coautore: Hella
  fatto: 'Sotto la gravità, mentre le ossa scricchiolano, una **luce verde tenue** gli si stringe alle spalle: *«Non sei solo a portare questo peso. Mai più solo.»* Lui la prende per Moradin. Era Hella, morta, a tre metri da lui nella stessa sala.'
  tono: intimo
  miccia: 'lunga (oltre il #3)'
  payoff: '⚠️ **Non spiegarlo prima della resurrezione (#3)** — è l''asimmetria scritta dal modulo (`ARC07-DEF-1` §9 Fase 1, regia). Paga due volte: **(a)** quando Hella torna e quelle parole tornano con lei — e il momento smette retroattivamente di essere la promessa di un dio e diventa quella di una compagna morta che stava per riportare indietro; **(b)** al Dono 1 del rito di Hella, perché è **questa** frase la ragione per cui Thorik dirà di sì al prezzo, non la devozione a Moradin. Per la giocatrice di Hella è il suo eco dal Sogno della Terra.'
  stato: armato
  tag: 🔫 armato
- id: E-07d
  data: '2026-07-31'
  autore: Terros
  fatto: l'ultimo suono del guardiano è di **assenso** (avevano curato i Cristalli)
  tono: luminoso
  miccia: lunga
  payoff: 'La Forgia registra la vittoria **onorata**. Un guardiano che approva è una porta che resta aperta: eco al #4 e nella Cronaca'
  stato: armato
  tag: 🔫 armato
- id: E-08a
  data: '2026-08-05'
  autore: DM
  fatto: 'approvata l''ala orchesca della Mano Rossa: dentro l''orda c''è **chi paga più di quanto incassa**'
  tono: grigio
  miccia: lunga (ARC-09 → dopoguerra)
  payoff: 'Qualunque cosa i PG scelgano, la valle avrà orchi **anche dopo la guerra**: la domanda è se con un atto o con un assedio. Riemerge quando si contano i vivi a Rethmar'
  stato: armato
  tag: 🔫 armato
