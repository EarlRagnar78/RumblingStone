# La legenda dei simboli — fonte unica (ADR-0048)
# ============================================================================
# Questo file e' la SOLA casa della legenda. Nessuno script puo' dichiarare un
# proprio set di simboli: il gate `legend/single-source`
# (scripts/tests/test_legenda_fonte_unica.py) lo boccia.
#
# Prima di ADR-0048 la stessa informazione viveva in cinque posti: `SYMBOLS` in
# render_map_svg.py, `WALL_SYMS`/`DOOR_SYMS`/`LIGHT_SYMS` in export_uvtt.py e
# `HAZARD_SYMS` in import_ultraclear.py. Non erano ancora divergenti in
# appartenenza — ma **lo erano gia' state due volte**, e ogni volta e' costato
# un ADR a se' (ADR-0042 e ADR-0043) per rattoppare un sintomo della stessa
# causa.
#
# ⚠️ NON SI MODIFICA A MANO scripts/legend.json: si cambia QUESTO file e si
#    rigenera con `python3 scripts/build_legend.py`. La CI confronta i due.
#
# ---------------------------------------------------------------------------
# render — come si disegna. Non cambia mai col sistema di regole.
#   mode: fill  terreno texturizzato ("pat" = pattern procedurale)
#   mode: unit  segnalino di creatura (gradiente radiale + anello)
#   mode: icon  prop illustrato in-house ("prop"); senza prop, ripiega
#               sull'emoji. Il terreno sotto si eredita dalla cella vicina.
#   heavy: true ombra portata + contorno marcato (muri, strutture, massicci)
#   altezza_m   estrusione 3D in metri per la catena Blender (negativa = scavo).
#               ⚠️ NON e' un numero libero: e' un MODULO DI GRIGLIA. Decisione
#               DM del 2026-09-12 — *«muri piccoli 1.5 metri e poi multipli di
#               1.5 o approssimazioni piu' vicine possibili»*. Il quadretto del
#               repo e' 1,5 m (spec §3.5), quindi:
#                 · cio' che STA IN PIEDI  -> quadretti interi (1.5 * n)
#                 · l'ingombro che si SCAVALCA -> mezzo quadretto (0.75)
#                 · cio' che e' PIATTO -> 0.0
#               Oggi: 15 altezze a quadretto intero, 9 a mezzo, 7 piatte.
#               Un'altezza fuori modulo la boccia
#               test_legenda_fonte_unica.TestLeAltezzeSonoModuliDiGriglia.
#   piatto: true resta a quota zero: un varco non e' un volume
#   texture     cartella di texture per famiglia di superficie — NON uno slug
#               di Poly Haven: la riempie il DM verificando la licenza
#
# function — cosa fa nello spazio. Non cambia col sistema di regole.
#   wall:   true  blocca vista e movimento; diventa segmento di muro in UVTT
#   door:   true  varco; geometria di porta in UVTT
#   light:  {quadretti, colore}  sorgente luminosa
#   hazard: true  l'import lo classifica come pericolo, non come struttura
#
# 🔴 QUI NON ENTRA NESSUN NUMERO DI GIOCO. «+4 CA», «20%», «x2 movimento»
#    vivono nei profili di ADR-0039, ed e' la ragione per cui il prodotto puo'
#    supportare 3.5, PF1e e 5e senza tre legende.
#
# ⚠️ LIMITE DICHIARATO, e non e' una svista. La specifica normativa
#    (docs/guides/LEGENDA-FUNZIONALE-SPEC.md §4) descrive un `function` molto
#    piu' ricco — cover, obscurement, move_cost, elevation_m, climb, nameable.
#    Quei valori NON sono qui perche' quella spec e' ancora «proposta, gate DM»
#    (sua riga 32): non sono canone, sono una proposta di luglio mai approvata.
#    Ratificarla trasformerebbe 2.101 celle in muri (🌲 2.073, 🌳 18, 📦 10):
#    e' la decisione D1 di plans/PIANO-VENDIBILITA.md §8, della stessa taglia di
#    ADR-0043. Finche' non e' presa, qui c'e' solo cio' che il codice applica.
# ============================================================================
version: 1
symbols:
