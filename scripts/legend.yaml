    label: "Foresta densa (Furtività +5, copertura)"
    render: {mode: fill, pat: t_forest, fill: "#55754d", altezza_m: 4.5, texture: fogliame}
    function:
      blocks_movement: false
      blocks_sight: true
      # ⚠️ DEROGA DICHIARATA: il fatto neutro dice che blocca la vista,
      #    ma l'export UVTT non ci mette un muro. Motivo obbligatorio:
      deroga_uvtt: >-
        il muro UVTT e' binario e il bosco no: blocca la vista ATTRAVERSO la
        cella, non DENTRO. Farlo muro pieno vorrebbe dire che un PG in mezzo
        agli alberi non vede il quadretto adiacente. Il glifo del margine e' il
        lotto di ADR-0051 (decisione DM del 2026-09-12).
      cover: half
      obscurement: heavy
      move_cost: 4
      nameable: false
